<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Financeiro Pessoal</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <button class="menu-button">
        <img src="./img/investimento.png" alt="">
    </button>
    <aside>
        <nav class="sidebar">
            <ul>
                <li>
                    <span>🏠</span>
                    <a href="#">Visão Geral</a>
                </li>
                <li>
                    <span>💵</span>
                    <a href="#">Transações</a>
                </li>
                <li>
                    <span>💳</span>
                    <a href="#">Orçamentos</a>
                </li>
                <li>
                    <span></span>
                    <a href="#"> Categorias</a>
                </li>
                <li>
                    <span>⚙️</span>
                    <a href="#">Configuracões</a>
                </li>
            </ul>
        </nav>
    </aside>

    <!-- conteudo principal -->
     <main class="conteudo">

        <!-- Cabeçalho -->
         <div class="header">
            <header>
                <h1>Visão Geral Financeira</h1>

                <div class="grupo-direita">
                    <input type="month" name="" id="">
                    <button>+ Nova Transações</button>
                </div>
        </header>
         </div>
  
        <!-- Cards -->
         <section class="cards">
            <div class="card">
                <h3>Saldo Total</h3>
                <p>R$14.350,75</p>
            </div>
            <div class="card">
                <h3>Receitas do Mês</h3>
                <p>R$5.100,00</p>
            </div>
            <div class="card">
                <h3>Despesas do Mês</h3>
                <p>R$3.245,30</p>
            </div>
            <div class="card">
                <h3>Economia</h3>
                <p>R$1.854,70</p>
            </div>
         </section>

         <div id="area-do-dashboard">
        <div class="dashboard-grid">
            <!-- CARD 1: EVOLUÇÃO DO SALDO (Gráfico de linha) -->
            <div class="card-dashboard">
                <h2 class="card-title">Evolução do Saldo</h2>
                <div class="chart-container">
                    <canvas id="lineChart"></canvas>
                </div>
            </div>

            <!-- CARD 2: GASTOS POR CATEGORIA (Gráfico de Rosca + Legenda) -->
            <div class="card-dashboard">
                <h2 class="card-title">Gastos por Categorias</h2>
                <div class="donut-container">
                    <div class="chart-container">
                        <canvas id="donutChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
     </div>
     </main>
    <script src="script.js"></script>
</body>
</html>
